<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <section class="parent">
    
        <div class="box" id="tl">linear-gradient(#FF5500, #FFD000)</div>
        <div class="box" id="tr">linear-gradient(to bottom, #0F2042, #007AA5, #00A3E0)</div>
        <div class="box" id="bl">linear-gradient(45deg, #1C1C1C, #F7F9FA)</div>
        <div class="box" id="br">linear-gradient(#D32F2F 0%, #1E1E24 50%, #F5F6F8 100%)</div>
        <div class="box" id="bbl">linear-gradient(#B35433, 15%, #F5EFEB)</div>
   
   </section>
</body>
</html>
